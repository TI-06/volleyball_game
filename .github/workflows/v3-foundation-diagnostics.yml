name: V3 Foundation Diagnostics

on:
  push:
    branches:
      - rebuild/gameplay-v3

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci
      - name: Install Chromium
        id: browser
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Run non-failing full regression gate
        if: always()
        shell: bash
        run: |
          set +e
          if [ "${{ steps.install.outcome }}" != "success" ] || [ "${{ steps.browser.outcome }}" != "success" ]; then
            echo "INSTALL_EXIT=1"
            echo "DIAGNOSTIC_STATUS=RED"
            exit 0
          fi
          npm run verify:full
          VERIFY_EXIT=$?
          echo "VERIFY_EXIT=$VERIFY_EXIT"
          if [ "$VERIFY_EXIT" -eq 0 ]; then
            echo "DIAGNOSTIC_STATUS=GREEN"
          else
            echo "DIAGNOSTIC_STATUS=RED"
          fi
          exit 0
