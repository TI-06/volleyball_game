name: V3 Foundation Diagnostics

on:
  push:
    branches:
      - rebuild/gameplay-v3

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci
      - name: Install Chromium
        id: browser
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Run non-failing V3 visual audit
        if: always()
        shell: bash
        run: |
          set +e
          if [ "${{ steps.install.outcome }}" != "success" ] || [ "${{ steps.browser.outcome }}" != "success" ]; then
            echo "INSTALL_EXIT=1"
            echo "DIAGNOSTIC_STATUS=RED"
            exit 0
          fi
          npm test -- tests/unit/game/v3/camera.test.ts
          UNIT_EXIT=$?
          npm run build
          BUILD_EXIT=$?
          npx playwright test tests/e2e/v3-prototype.spec.ts
          E2E_EXIT=$?
          echo "UNIT_EXIT=$UNIT_EXIT"
          echo "BUILD_EXIT=$BUILD_EXIT"
          echo "E2E_EXIT=$E2E_EXIT"
          if [ "$UNIT_EXIT" -eq 0 ] && [ "$BUILD_EXIT" -eq 0 ] && [ "$E2E_EXIT" -eq 0 ]; then
            echo "DIAGNOSTIC_STATUS=GREEN"
          else
            echo "DIAGNOSTIC_STATUS=RED"
          fi
          exit 0
      - name: Upload V3 visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-visual-audit
          path: test-results/v3-visual-audit
          if-no-files-found: ignore
          retention-days: 1
