name: rally-transition-diagnostics

on:
  push:
    branches:
      - feat/rally-transition-readability

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full gate without failing workflow
        shell: bash
        run: |
          set +e
          npm run verify:full > verify.log 2>&1
          verify_code=$?
          cat verify.log
          if [ "$verify_code" -ne 0 ]; then
            echo "VERIFY_EXIT=1"
          else
            echo "VERIFY_EXIT=0"
          fi
          exit 0
