name: focused-serve-diagnostics

on:
  push:
    branches:
      - feat/match-animation-system-design

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Run Task 2 verification without failing workflow
        shell: bash
        run: |
          set +e
          npm test -- tests/unit/game/serveTrajectory.test.ts tests/integration/game/reworkServeLanding.test.ts tests/integration/game/reworkPowerControls.test.ts > focused.log 2>&1
          focused_code=$?
          npm run verify > verify.log 2>&1
          verify_code=$?
          cat focused.log
          cat verify.log
          echo "FOCUSED_TEST_EXIT=$focused_code"
          echo "VERIFY_EXIT=$verify_code"
          exit 0
