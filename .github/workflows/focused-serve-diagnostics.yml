name: focused-serve-diagnostics

on:
  push:
    branches:
      - feat/match-animation-system-design

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Run focused Task 1 verification without failing workflow
        shell: bash
        run: |
          set +e
          npm test -- tests/unit/game/serveTrajectory.test.ts tests/integration/game/reworkPowerControls.test.ts > focused.log 2>&1
          test_code=$?
          npm run typecheck > typecheck.log 2>&1
          typecheck_code=$?
          cat focused.log
          cat typecheck.log
          echo "FOCUSED_TEST_EXIT=$test_code"
          echo "TYPECHECK_EXIT=$typecheck_code"
          exit 0
