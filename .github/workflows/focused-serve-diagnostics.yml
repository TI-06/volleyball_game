name: focused-development-diagnostics

on:
  push:
    branches:
      - feat/match-animation-system-design

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full verification without failing workflow
        shell: bash
        run: |
          set +e
          npm run verify:full > verify.log 2>&1
          verify_code=$?
          cat verify.log
          echo "VERIFY_EXIT=$verify_code"
          exit 0
      - name: Upload mobile visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-audit
          path: test-results/visual-audit
          if-no-files-found: ignore
          retention-days: 3
