name: PR2 Temporary Verification

on:
  push:
    branches:
      - feat/gameplay-rework-2-5d
    paths:
      - .github/workflows/pr2-temporary-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Diagnose verification without failing the workflow
        shell: bash
        run: |
          set +e

          npm install --no-audit --no-fund 2>&1 | tee .pr2-install.log
          install_exit=${PIPESTATUS[0]}

          playwright_install_exit=99
          typecheck_exit=99
          test_exit=99
          build_exit=99
          e2e_exit=99

          if [ "$install_exit" -eq 0 ]; then
            npx playwright install --with-deps chromium 2>&1 | tee .pr2-playwright-install.log
            playwright_install_exit=${PIPESTATUS[0]}

            npm run typecheck 2>&1 | tee .pr2-typecheck.log
            typecheck_exit=${PIPESTATUS[0]}

            npm test 2>&1 | tee .pr2-test.log
            test_exit=${PIPESTATUS[0]}

            npm run build 2>&1 | tee .pr2-build.log
            build_exit=${PIPESTATUS[0]}

            if [ "$playwright_install_exit" -eq 0 ]; then
              npm run test:e2e 2>&1 | tee .pr2-e2e.log
              e2e_exit=${PIPESTATUS[0]}
            fi
          fi

          printf 'head_before=%s\ninstall_exit=%s\nplaywright_install_exit=%s\ntypecheck_exit=%s\ntest_exit=%s\nbuild_exit=%s\ne2e_exit=%s\n' \
            "${GITHUB_SHA}" "$install_exit" "$playwright_install_exit" "$typecheck_exit" "$test_exit" "$build_exit" "$e2e_exit" \
            > .pr2-verification-result.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pr2-verification-result.txt .pr2-*.log

          if [ "$install_exit" -eq 0 ] && [ "$playwright_install_exit" -eq 0 ] && [ "$typecheck_exit" -eq 0 ] && [ "$test_exit" -eq 0 ] && [ "$build_exit" -eq 0 ] && [ "$e2e_exit" -eq 0 ] && [ -f package-lock.json ]; then
            git add package-lock.json
          fi

          git commit -m 'chore: record PR2 diagnostic verification [skip ci]'
          git push

          exit 0
